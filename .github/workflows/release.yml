name: Release

# v で始まるタグ (例: v1.2.0) が push されたら、GitHub Release を作り、Android 版の APK を加える。
# Release に載る focusr-<版>.apk を、インストール済みの Android 版が起動したときに見て、更新を知らせる (mobile-update.js)。
on:
  push:
    tags: ['v*']

permissions:
  contents: write # Release の作成とファイルのアップロードに必要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # タグと package.json の version がずれていたら、公開せずに止める
      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "タグ $GITHUB_REF_NAME と package.json の version ($version) が一致しません"
            exit 1
          fi
      # release-notes/<タグ>.md からタイトルと説明文を取り出す。ファイルがない・空なら公開せずに止める
      - name: Prepare release notes
        id: notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
      # Release は下書き (draft) で作る。APK を加えてから、最後の publish の手順で公開する。
      # APK のビルドが失敗しても、APK のない Release が「最新」として公開されたままにならない
      # (Android 版は最新の Release に APK がないと、更新を知らせられないため)。
      # 同じタグの Release がすでにあれば (途中で失敗した・作り直す場合)、下書きに戻してタイトルと説明文を更新し、
      # 古いファイルをすべて消して、これから加える APK だけにする。
      # タイトルは環境変数を通して渡し、コマンドの文字列に直接埋め込まない (GitHub が推奨する書き方)
      - name: Create draft GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME はすでにあるので、上書きします"
            gh release edit "$GITHUB_REF_NAME" --draft=true --title "$RELEASE_TITLE" --notes-file "$RELEASE_BODY_FILE"
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes
            done
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$RELEASE_TITLE" --notes-file "$RELEASE_BODY_FILE"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TITLE: ${{ steps.notes.outputs.title }}
          RELEASE_BODY_FILE: ${{ steps.notes.outputs.body_file }}

  # Android 版の APK を作り、上で作った下書きの Release に focusr-<版>.apk として加える (以前の名前でも加える。android-build.yml)
  android:
    needs: release
    uses: ./.github/workflows/android-build.yml
    with:
      release-tag: ${{ github.ref_name }}
    secrets: inherit

  # APK を加え終わったら、下書きを公開する
  publish:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
