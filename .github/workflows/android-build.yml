name: Android build

# スマホ版 (Capacitor) の APK を作る、ほかのワークフローから呼び出して使う手順 (android.yml と release.yml から呼ぶ)。
# 開発に使うパソコンには Android Studio を入れられないので、GitHub のサーバー (Android SDK が最初から入っている) でビルドする。
# android/ フォルダーは git に入れず、ここで毎回作り直す。署名には、Secrets に入れた固定の鍵を使う (なければ失敗する)。
# variant が dev のときは、完成版と並べて入れられる開発版 (識別子の末尾が .dev、名前は「Focusr (開発版)」) にし、
# 下書き (draft) の Release「dev」に focusr-dev.apk として上書きで置く。下書きはリポジトリに書き込める人にしか見えないので、
# リポジトリが公開のままでも、開発版は開発者だけが取れる (Actions の成果物は、ログインした人なら誰でも取れるため使わない)。
# release-tag を渡したときは、その Release に focusr-<版>.apk として加える (スマホ版が更新を知らせるのに使う)。
on:
  workflow_call:
    inputs:
      variant:
        description: '作る APK の種類 (release: 完成版、dev: 開発版)'
        type: string
        default: release
      release-tag:
        description: APK を加える Release のタグ (空なら Actions の成果物として置くだけ)
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: variant と release-tag の組み合わせを確かめる
        env:
          VARIANT: ${{ inputs.variant }}
          TAG: ${{ inputs.release-tag }}
        run: |
          case "$VARIANT" in
            release|dev) ;;
            *) echo "::error::variant は release か dev ($VARIANT)"; exit 1 ;;
          esac
          if [ "$VARIANT" = dev ] && [ -n "$TAG" ]; then
            echo "::error::開発版は Release に加えられない (release-tag: $TAG)"
            exit 1
          fi
          echo "VARIANT=$VARIANT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Capacitor 8 は Node 22 以上が必要
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - name: Android のプロジェクトを作り、画面 (src) と部品を入れる
        run: |
          npx cap add android
          npx cap sync android
          if [ "$VARIANT" = dev ]; then node scripts/android-variant.mjs dev android; fi
      - name: このアプリの Java (mobile/。画面・URL を暗号化する部品・ロック画面のタイマーと曲の部品) を入れる
        run: |
          DIR=android/app/src/main/java/io/github/marusako/focusr
          [ -f "$DIR/MainActivity.java" ] || { echo "::error::Capacitor の MainActivity が見つからない ($DIR)"; exit 1; }
          cp mobile/*.java "$DIR/"
          ls "$DIR"
      - name: アプリのアイコン (mobile/res。以前のパソコン版の時計を描き直したもの) で、Capacitor の初めのアイコンを置きかえる
        run: |
          RES=android/app/src/main/res
          [ -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" ] || { echo "::error::Capacitor のアイコンの設定が見つからない ($RES)"; exit 1; }
          cp -r mobile/res/. "$RES/"
          cat "$RES/mipmap-anydpi-v26/ic_launcher.xml"
      - name: タイマーの終わりの通知を正確な時刻に出すための権限を足す
        # 権限がないと、Android 12 以降は電池の節約のため通知が 10 分ほどずらされることがある。
        # USE_EXACT_ALARM (Android 13 以降) はタイマー・アラームのアプリ向けで、インストールしたときに自動で許可される。
        # Android 12 では SCHEDULE_EXACT_ALARM を使う (Android 12 では最初から許可されている)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n 'EXACT_ALARM' android/app/src/main/AndroidManifest.xml
      - name: ロック画面のタイマーと曲の部品 (mobile/LockScreen.java) のサービス・受け取り口と権限を足す
        # 曲を選んでいる間のフォアグラウンドサービス (種類は mediaPlayback。Android 14 以降は種類ごとの権限も要る) と、
        # 流している間に画面を消しても処理を止めないウェイクロック。タイマーの区切りの時刻に起こされる受け取り口 (receiver)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <service android:name=".NowPlayingService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n        <receiver android:name=".TimerNoticeReceiver" android:exported="false" />\n    </application>#' "$M"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' "$M"
          grep -q 'NowPlayingService' "$M" || { echo "::error::サービスを AndroidManifest.xml に足せなかった"; exit 1; }
          grep -nE 'NowPlayingService|TimerNoticeReceiver|FOREGROUND_SERVICE|WAKE_LOCK' "$M"
      - name: 版の番号を入れる (versionName は package.json の version、versionCode は版から作る。src/mobile-update.js)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node --input-type=module -e "import { versionCode } from './src/mobile-update.js'; console.log(versionCode('$VERSION'))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          NAME="$VERSION"
          APK="focusr-$VERSION.apk"
          if [ "$VARIANT" = dev ]; then
            NAME="$VERSION-dev"
            APK="focusr-dev-$VERSION.apk"
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1\$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$NAME\"/" android/app/build.gradle
          if ! grep -q "versionCode $CODE" android/app/build.gradle; then
            echo "::error::versionCode を書き換えられなかった"
            exit 1
          fi
          grep -nE 'versionCode|versionName' android/app/build.gradle
      - name: APK をビルドする (署名はこのあとで行う)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: 固定の鍵で署名する
        # 鍵は GitHub の Secrets に入れてある (ANDROID_KEYSTORE_BASE64: PKCS12 の鍵を base64 にしたもの、
        # ANDROID_KEYSTORE_PASSWORD: そのパスワード)。毎回同じ鍵で署名するので、新しい版を上書きでインストールできる
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 失敗したら、どこで失敗したかを annotations (ログインしなくても読めるお知らせ) に残す。鍵やパスワードは出さない
          fail() { echo "::error::$1: $(printf '%s' "$2" | tail -n 4 | tr '\n' ' ' | cut -c1-600)"; exit 1; }
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            fail "Secrets に ANDROID_KEYSTORE_BASE64 と ANDROID_KEYSTORE_PASSWORD が入っていない" ""
          fi
          # 貼り付けで入った改行や空白は除く
          out=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d 2>&1 > "$RUNNER_TEMP/release.p12") || fail "鍵の base64 を戻せない" "$out"
          out=$(keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD 2>&1) \
            || fail "鍵を開けない (大きさ $(wc -c < "$RUNNER_TEMP/release.p12") バイト、SHA-256 の先頭 $(sha256sum "$RUNNER_TEMP/release.p12" | cut -c1-16)、パスワード $(printf '%s' "$KEYSTORE_PASSWORD" | wc -c) 文字)" "$out"
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          out=$("$TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk" 2>&1) || fail "zipalign ($TOOLS)" "$out"
          out=$("$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD --out "$APK" "$RUNNER_TEMP/aligned.apk" 2>&1) || fail "apksigner sign" "$out"
          rm -f "$RUNNER_TEMP/release.p12"
          out=$("$TOOLS/apksigner" verify --print-certs "$APK" 2>&1) || fail "apksigner verify" "$out"
          printf '%s\n' "$out" | grep -E 'certificate (DN|SHA-256)' || true
      - uses: actions/upload-artifact@v7
        if: inputs.variant != 'dev'
        with:
          name: focusr-android
          path: focusr-*.apk
          retention-days: 14
      - name: 開発版を下書きの Release「dev」に置く (開発者だけが取れる)
        if: inputs.variant == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 下書きのままにしておく。公開すると誰でも見られ、完成版の更新の知らせ (最新の Release を見る) にも混ざるため
          NOTES="開発版 $VERSION-dev (コミット ${GITHUB_SHA:0:7})。下書きのまま使う。公開しない。"
          if gh release view dev > /dev/null 2>&1; then
            gh release edit dev --draft=true --notes "$NOTES"
          else
            gh release create dev --draft --title "開発版 (下書き・開発者だけ)" --notes "$NOTES"
          fi
          cp "$APK" focusr-dev.apk
          gh release upload dev focusr-dev.apk --clobber
      - name: Release に APK を加える
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
        run: |
          # タグと版がずれていたら加えない (release.yml でも確かめている)
          [ "v$VERSION" = "$TAG" ] || { echo "::error::タグ $TAG と版 $VERSION が一致しない"; exit 1; }
          gh release upload "$TAG" "focusr-$VERSION.apk" --clobber
