name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # テストは画面を使わない純粋な Node.js のコードなので Linux で動かす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
